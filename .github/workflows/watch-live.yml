# THE ONLY THING IN THIS SYSTEM THAT LOOKS AT THE LIVE SITES.
#
# Everything else is checked at build time, inside a repository, before
# anything is published. That is good machinery and it is not the gap. The gap
# is that if a scheduled run silently stops -- GitHub drops crons, or a job
# fails and the email is not read -- the sites go on serving whatever was last
# committed and the first person to notice is a farmer reading a stale price.
#
# WHY IT LIVES HERE and not in the site repos: this repository publishes
# nothing, so its failures cannot be confused with a publishing failure, and it
# keeps watching even when a site repo's own Actions are broken. It needs no
# secret and no permissions -- it only reads two public websites.
#
# HOW IT TELLS YOU: by failing. A failed workflow emails the owner. There is no
# new service, no webhook, and nothing else to keep alive.
#
# WHAT IT CANNOT CATCH, said plainly: itself. A watchdog on the same scheduler
# as the thing it watches is silent when the scheduler is down. There is no
# fixing that from inside GitHub, and it does not need fixing -- if everything
# stops, the sites fall back to "Call for today's price" at 14 hours rather
# than showing a wrong number, which is the correct way for a scale house to
# fail.
name: Watch the live sites

on:
  schedule:
    # Through the market window and a little either side. Off the top of the
    # hour, like every other cron in this project, because :00 is when the
    # whole platform fires at once.
    - cron: "23 13,15,17,19,21 * * 1-5"
    # Once each weekend morning, so a Saturday outage is not found on Monday.
    - cron: "23 15 * * 6,0"
  workflow_dispatch:

permissions:
  # WRITE, because this workflow now publishes status.json. It was `read` while
  # everything the watchdog learned went into the run log and was thrown away.
  contents: write

concurrency:
  group: watch-live
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20" }

      # The watchdog's own guards run first. A watchdog whose logic is broken
      # reports "all clear" just as convincingly as a working one.
      - name: Test the watchdog before trusting it
        # status.test.mjs is here as well as in the weekly suite because its
        # guards are about THIS workflow -- that it can write, that it stages
        # the file, that it does so on a failing run. A guard that only runs on
        # Mondays would let six days of a broken publish through.
        run: node --test test/watch-live.test.mjs test/status.test.mjs

      - name: Look at the live sites
        run: node tools/watch-live.mjs

      # if: always() BECAUSE THE FAILING RUN IS THE ONE THAT MATTERS. The step
      # above sets a non-zero exit code when it finds something above `low`, and
      # without this the status file would be published on exactly the days
      # nothing was wrong. tools/watch-live.mjs writes the file before it sets
      # that code, so there is always something here to commit.
      - name: Publish what it saw
        if: always()
        run: |
          set -uo pipefail
          git config user.name  "emmert-bot"
          git config user.email "bot@midwestagsupply.invalid"
          git add status.json
          if git diff --staged --quiet; then
            echo "status.json unchanged, which should not happen: generated moves every run"
          else
            git commit -m "watch: $(TZ=America/Chicago date '+%-d %B %-I:%M%p')"
            for i in 1 2 3; do
              git push && break
              git pull --rebase --autostash && sleep 3
            done
          fi
