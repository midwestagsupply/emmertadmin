# READ THEIR BOARD MYSELF IF read.yml DID NOT.
#
# ── THE FAILURE THIS WAS BUILT FOR, MEASURED 2026-09-14 ──────────────────────
#
# read.yml asks for a pass every ten minutes: cron "3,13,23,33,43,53 * * * *".
# It commits data/index.json whenever anything in it changes, and `attemptedAt`
# changes on EVERY pass, pass or fail. So a commit is exact evidence that a pass
# completed, and a missing commit is exact evidence that one did not.
#
# Commits to data/index.json on 2026-09-14, the whole day:
#
#     00:07:37
#     04:48:17
#     10:08:54
#     16:20:52
#
# Four passes against 102 fires due. The gaps are 4h41m, 5h20m and 6h12m.
#
# ── WHY THAT TOOK THE PRICE OFF BOTH WEBSITES ────────────────────────────────
#
# tools/update-prices.mjs in each site repo withdraws the price when the
# reader's last successful check is more than FEED_MAX_AGE_H = 4 hours old, and
# it reads that time out of data/index.json in this repository. Every gap above
# is longer than four hours, so every gap blanked the panel to "Call for today's
# price" until the next pass landed:
#
#     00:07 ok  ->  04:08 the sites withdrew
#     04:58 ok  ->  08:58 the sites withdrew
#     10:18 ok  ->  14:31 the sites withdrew
#
# Nothing was broken downstream and nothing published a stale number. The sites
# did exactly what they are supposed to do with a reader that has gone quiet.
# The reader had not gone quiet on purpose; its runs were not happening.
#
# ── WHAT THIS DOES NOT DO ────────────────────────────────────────────────────
#
# It does not explain why the fires are being dropped. GitHub's scheduler is
# best effort and a dropped fire produces NO RUN AT ALL: nothing red, nothing
# queued, nothing cancelled, no entry in the run list. There is nothing to
# diagnose from inside the repository, which is the whole reason a second,
# independent path has to exist rather than the first one being repaired.
#
# It is also NOT a second reader. It runs the same scripts/read.mjs, behind the
# same test gate, under the SAME concurrency group as read.yml -- so the two can
# never write data/ at the same time, and whichever gets a runner first wins
# while the other waits. Everything it publishes has passed every guard the
# ordinary path applies.
#
# ── WHY :08 AND :38 ──────────────────────────────────────────────────────────
#
# Clear of read.yml (3,13,23,33,43,53), clear of watch-live.yml (:23), and clear
# of :00, which is the busiest minute on the platform. TWO FIRES AN HOUR AND NOT
# ONE, because this file is subject to the same dropped-fire problem it exists
# to catch. Two independent chances an hour is the cheapest redundancy for the
# redundancy.
#
# ── WHY 45 MINUTES ───────────────────────────────────────────────────────────
#
# read.yml asks every ten. Forty-five means four consecutive fires have been
# dropped before this steps in, so an ordinary late run or a single miss costs
# nothing and this file stays silent on a healthy day. It is also far inside the
# sites' four-hour window: a cold spell has to survive this twice over before a
# farmer could ever see it.
#
# On a healthy day this job checks one committed timestamp and exits. That is
# the intended behaviour and it is not a no-op -- it is the measurement.
#
# ── HOW WELL IT ACTUALLY COVERED, 2026-09-12 17:58Z TO 2026-09-18 14:54Z ──────
#
# Measured the same way the incident above was measured, off the commits to
# data/index.json:
#
#     40 gaps ran past this file's 45-minute threshold
#     16 of them were ended by a watchdog commit         40%
#     median gap that this file ended: 146 minutes
#
# It works. It is also, on its own numbers, three times slower than its
# threshold, and for the same reason the thing it covers for is slow: its own
# fires are dropped at the same rate. Every one of those 16 covers landed at a
# staleness between 61 and 271 minutes, never at 45. A file that asks twice an
# hour and gets one ask in four is checking about every two hours, whatever the
# cron says, and that is why eight gaps still crossed four hours with this file
# in place the whole time.
#
# ── WHY NEITHER NUMBER CHANGES, 2026-09-18 ───────────────────────────────────
#
# The 40% is not a threshold problem and cannot be fixed by lowering 45. The
# missed 60% are fires that never happened; a smaller number would have been
# compared against the same missing runs. More fires do not help either --
# dnilgis/bids measured that asking more often does not deliver more often --
# and this file exists precisely for the case where the scheduler is dropping
# things, so paying it more asks is paying the broken thing.
#
# What changes instead is above this file. read.yml can now be started by the
# two site repositories as well as by this account's cron, and those
# repositories are served far better than this one: over the same 845
# ten-minute slots, badgergrain and midwestcommodity each put a run into 479 of
# them, 56.7%, against this repository's 186, 22.0%. Same account, same
# organisation, same six fires an hour, same week. So read.yml should now be
# started in roughly three slots in five rather than one in five, and the 45
# minutes below should be reached only when every one of those tickets has lost
# four times running.
#
# This file becomes what it was always supposed to be -- the cover for the day
# the cover is needed -- rather than the thing quietly holding the feed up
# sixteen times a week. If it keeps writing commits at the old rate, that is
# the signal that the sites are not getting through, and the next section is
# what it has to say about it.

name: watchdog

on:
  schedule:
    - cron: "8,38 * * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Read even if the last pass looks recent"
        type: boolean
        default: false

permissions:
  contents: write

# THE SAME GROUP AS read.yml, ON PURPOSE. Two jobs running scripts/read.mjs at
# once would both write data/boyceville.json and data/index.json and then race
# each other to push. cancel-in-progress stays false so a queued cover-up run
# waits its turn rather than being thrown away.
concurrency:
  group: read-boyceville
  cancel-in-progress: false

jobs:
  watchdog:
    runs-on: ubuntu-latest
    # THE SAME CEILINGS AS read.yml, FOR THE SAME REASONS AND BECAUSE IT RUNS
    # THE SAME SCRIPT. They share a concurrency group, so a wedged run of
    # either one is a wedged run of both, and a ceiling that differed between
    # them would mean the shared group was held for whichever number was
    # larger. test/mirror.test.mjs pins them to each other.
    timeout-minutes: 5
    steps:
      # ref, not github.sha -- the same lesson read.yml records. A run that sat
      # in the concurrency queue would otherwise start from whatever HEAD was
      # when it was created and have its push rejected as non-fast-forward.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - uses: actions/setup-node@v4
        with: { node-version: "20" }

      # HOW IT KNOWS, WITHOUT ASKING THE API.
      #
      # data/index.json is in the checkout and carries the reader's own
      # checkedAt. That is a liveness signal with no token, no rate limit and no
      # second service to be down. It is the SAME field tools/update-prices.mjs
      # measures in each site repo, so this cannot disagree with the thing it is
      # protecting.
      - name: How long since the reader last succeeded
        id: age
        shell: bash
        run: |
          set -e
          node -e '
            const fs = require("fs");
            let t = null;
            try {
              const i = JSON.parse(fs.readFileSync("data/index.json", "utf8"));
              const s = (i.sources || []).find((x) => x && x.id === "boyceville");
              if (s && typeof s.checkedAt === "string") t = Date.parse(s.checkedAt);
            } catch (e) {
              /* An index that will not parse is not a fresh index. Fall through
                 to Infinity so the reader runs and rewrites it. */
            }
            const mins = Number.isFinite(t)
              ? Math.round((Date.now() - t) / 60000) : 1e9;
            console.log(Number.isFinite(t)
              ? `the reader last succeeded ${mins} minute(s) ago`
              : "data/index.json carries no readable checkedAt for boyceville");
            fs.appendFileSync(process.env.GITHUB_OUTPUT, `mins=${mins}\n`);
          '

      - name: Nothing to do
        if: steps.age.outputs.mins < 45 && !inputs.force
        run: echo "last pass ${{ steps.age.outputs.mins }}m ago, inside 45m — read.yml is keeping up."

      # Everything below mirrors read.yml step for step, deliberately. A cover-up
      # pass that skipped the test gate, or committed differently, would be a
      # second way to publish a price -- and the one thing worse than a missing
      # price is two paths to a wrong one.
      - name: Test the reader this pass is about to use
        if: steps.age.outputs.mins >= 45 || inputs.force
        timeout-minutes: 2
        run: node --test test/mirror.test.mjs test/fork.test.mjs test/routes.test.mjs test/reconstruct.test.mjs

      # Two minutes against lib/routes.mjs's own ROUTE_BUDGET_MS of 60_000, the
      # absolute wall-clock deadline for the whole pass however many routes are
      # in the air at once. A read still
      # running at two minutes has broken its own library's deadline and is
      # stuck, not slow, and killing it here leaves the commit below its turn.
      - name: Read their board
        id: read
        if: steps.age.outputs.mins >= 45 || inputs.force
        timeout-minutes: 2
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          echo "covering for a missed run: last pass ${{ steps.age.outputs.mins }} minute(s) ago"
          node scripts/read.mjs | tee /tmp/read.log

      # Three, because the push race loop can still read their board again --
      # only when the commits it lost to changed the feed, and then only
      # against the arranged URL. read.yml carries the long version of why;
      # this file is deliberately the same loop step for step.
      - name: Commit what changed
        if: always() && steps.read.outcome != 'skipped'
        timeout-minutes: 3
        run: |
          set -e
          git config user.name "Emmert Admin Bot"
          git config user.email "bot@badgergrain.com"
          BR="${GITHUB_REF_NAME:-main}"
          KEEP="${RUNNER_TEMP:-/tmp}/boyceville-keep"
          mkdir -p "$KEEP"
          for i in 1 2 3 4 5; do
            git add data/boyceville.json data/index.json 2>/dev/null || true
            if git diff --staged --quiet; then echo "Nothing changed."; exit 0; fi
            git commit -m "boyceville: $(date -u +%Y-%m-%dT%H:%M:%SZ) (watchdog)"
            if git push origin "HEAD:$BR"; then echo "Pushed on attempt $i."; exit 0; fi
            echo "Push race on attempt $i; rebasing this pass onto current HEAD."
            cp data/boyceville.json data/index.json "$KEEP/" 2>/dev/null || true
            WAS=$(git rev-parse "origin/$BR" 2>/dev/null || true)
            git fetch origin "$BR" && git reset --hard "origin/$BR"
            if [ -n "$WAS" ] && git diff --quiet "$WAS" "origin/$BR" -- data/boyceville.json data/index.json; then
              echo "  the commits we lost to left the feed alone; putting this pass's read back, no request to their host"
              cp "$KEEP/boyceville.json" "$KEEP/index.json" data/ 2>/dev/null || true
            else
              echo "  the feed moved underneath this pass; re-reading against the new baseline"
              node scripts/read.mjs || true
            fi
            sleep $((RANDOM % 4 + 2))
          done
          echo "::error::could not push after 5 attempts"
          exit 1

      # SAY SO WHEN IT HAD TO STEP IN. A watchdog that quietly covers for a
      # broken scheduler forever is a watchdog that hides the problem it was
      # built to survive. This does not fail the run -- the price is on the page,
      # which is the point -- it writes a line into the run summary that is there
      # to be read when somebody asks why the reader looks fine and is not.
      #
      # IT NAMES BOTH CAUSES NOW, 2026-09-18. It used to say "its scheduled
      # fires are being dropped", which was the only possible cause when GitHub
      # cron was the only trigger. Since the Cloudflare Worker took the ten
      # minutes there are two, and they need opposite fixes: GitHub dropping
      # fires is a known 24.4% and nothing to do, while the Worker failing is a
      # lapsed or unscoped token, a bad deploy, or a workflow_dispatch line
      # deleted from read.yml -- all of which are fixable in minutes by someone
      # who is told to go and look. Asserting the first cause would send that
      # person to the one place there is nothing to find.
      - name: Say that it had to cover
        if: steps.read.outcome != 'skipped'
        shell: bash
        run: |
          {
            echo "### The watchdog read their board"
            echo ""
            echo "read.yml's last successful pass was **${{ steps.age.outputs.mins }} minutes** ago."
            echo "It is asked for every ten by three separate repositories, so at least"
            echo "four consecutive asks were not delivered by any of them."
            echo ""
            echo "Three things can cause that and they need different fixes:"
            echo ""
            echo "1. **The sites are not getting through.** Their prices.yml pokes"
            echo "   read.yml on every run they get. Look in a recent badgergrain or"
            echo "   midwestcommodity run for the \`Start the reader\` step: it prints the"
            echo "   HTTP code it got. 404 or 403 from BOTH doors means"
            echo "   \`ADMIN_DISPATCH_TOKEN\` has lapsed or was never scoped"
            echo "   (Actions: read and write, or Contents: read and write, on this"
            echo "   repository). 'no token' means the secret is not set there at all."
            echo "2. **This repository's own cron is dropping fires.** Measured at 22.0%"
            echo "   of ten-minute slots over the six days to 2026-09-18, against 56.7%"
            echo "   for each of the two sites in the same week. Expected, not fixable"
            echo "   from inside this repository, and the reason 1 exists."
            echo "3. **The sites' schedules are being dropped too.** They were served"
            echo "   two and a half times better than this repository when that was"
            echo "   measured, but nothing guarantees they still are. Their own run"
            echo "   lists say whether they are running."
            echo ""
            echo "The price is on both websites. This file is why. If it keeps"
            echo "appearing, the fix is read.yml's delivery, not this."
          } >> "$GITHUB_STEP_SUMMARY"
